[env]
__CLI_CFG_EXEC_SILENT="y"

export __VAR_EXPANSION_WORDS="first \
second"

export ARGUMENT_OPTIONS="option1 \
option2 \
option3"

function create_cmd_words() {
	echo "thievery"
	echo "corporation"
}
function create_arg_options() {
	echo "opt1"
	echo "opt2"
}

function get_deployments() {
    kubectl get deployments -n "$1" -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n'
}
function get_pods() {
    kubectl get pods -n "$1" -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n'
}

[env.fish]
function create_cmd_words
    echo "thievery"
    echo "corporation"
end
function create_arg_options
    echo "opt1"
    echo "opt2"
end
function get_deployments
    kubectl get deployments -n $argv[1] -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n'
end
function get_pods
    kubectl get pods -n $argv[1] -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n'
end

[commands]
echo: \0 \2 \1
	:arg1:list:first
	:arg2:list:second
var-expansion
	$__VAR_EXPANSION_WORDS: echo \0
function-expansion
	&create_cmd_words: echo \0
list-expansion
	thievery|corporation: echo \0
list-argument
	static: echo
		:one-of-a-static-list:list:first-element|second|third|etc
	from-function: echo
		:arg-generated-by-function:eval:create_arg_options
	from-variable: echo
		:arg-from-variable:list:$ARGUMENT_OPTIONS
false: false
return2: return 2
install
	jar
		from
			file: echo
				:jar-file:FILE
			maven: echo
				:mvn-coords:list:a|b|c
	war
		from
			file: echo
				:war-file:FILE
			maven: ~/bin/install-maven-war.sh
				:mvn-coords:list:a|b|c
k
	get
		pods: kubectl get pods -o wide
		services: kubectl get svc
		nodes: kubectl get nodes -o wide
	logs
		default: kubectl logs -f -n default \1
			:pod:eval:get_pods default
		kube-system: kubectl logs -f -n kube-system \1
			:pod:eval:get_pods kube-system
	restart
		default: kubectl rollout restart deployment/\1 -n default
			:deployment:eval:get_deployments default
		kube-system: kubectl rollout restart deployment/\1 -n kube-system
			:deployment:eval:get_deployments kube-system
test-cmd: echo \1 \2
	:arg1:list:first|second
	:arg2:list:alpha|bravo
test-desc-list: echo
	:env:list:staging|prod:target environment
test-desc-file: echo
	:path:FILE:path to input
test-file-glob: echo
	:path:FILE:*.txt
test-file-glob-desc: echo
	:path:FILE:*.txt:text files
test-dir-glob: echo
	:path:DIR:*test*
test-file-or-dir-glob: echo
	:path:FILE_OR_DIR:*.log:log files
test-desc-range: echo
	:port:int_range:1-65535:TCP port number
test-desc-eval: echo
	:deployment:eval:get_deployments:target deployment
