[env]
# Default Options
#
# These don't need to be set here explicitly
# In a minimal configuration you could leave out the [env] section
# completely. The CLI config variables would have the following values
__CLI_CFG_EXEC_ACK_EXPANDED_COMMANDS="y"
__CLI_CFG_EXEC_EXPAND_ABBREVIATED_COMMANDS="y"
__CLI_CFG_EXEC_EXPAND_ABBREVIATED_ARGS="n"
__CLI_CFG_EXEC_PRINT_HELP_ON_INCOMPLETE_ARGS="y"
__CLI_CFG_EXEC_ARGS_ALLOW_COMPLETION_RESULTS_ONLY="n"
__CLI_CFG_EXEC_ALWAYS_RETURN_0="n"
__CLI_CFG_EXEC_SILENT="y"
__CLI_CFG_LOG_LEVEL=0
# Safe execution mode options (defaults shown)
__CLI_CFG_SAFE_MODE="n"
__CLI_CFG_ALLOW_CMD_SHELL_SYNTAX="y"
__CLI_CFG_ALLOW_ENV_CODE="y"
__CLI_CFG_ALLOW_CMD_WORD_EXPANSION="y"
__CLI_CFG_ALLOW_ARG_EXPANSION="y"

# example variable defining possible completion options for commands
# (needs to be used explicitly - see below)
export __VAR_EXPANSION_WORDS="first \
second"

# another one
export ARGUMENT_OPTIONS="option1 \
option2 \
option3"

# example function returning completion options
function create_cmd_words() {
	echo "thievery"
	echo "corporation"
}
# example function returning completion options for an argument
function create_arg_options() {
	echo "opt1"
	echo "opt2"
}

# kubernetes admin: dynamically populate deployment/pod lists from the cluster
function get_deployments() {
    kubectl get deployments -n "$1" -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n'
}
function get_pods() {
    kubectl get pods -n "$1" -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n'
}


[env.fish]
function create_cmd_words
    echo "thievery"
    echo "corporation"
end
function create_arg_options
    echo "opt1"
    echo "opt2"
end

[commands]
# demonstration of positional argument expansion
# \0: is the last command word (echo)
echo: \0 \2 \1
	:arg1:list:first
	:arg2:list:second
# demonstration of parameterized command word with variable
var-expansion
	$__VAR_EXPANSION_WORDS: echo \0
# demonstration of parameterized command word with function
function-expansion
	&create_cmd_words: echo \0
# demonstration of parameterized command word with static list
list-expansion
	thievery|corporation: echo \0
# demonstration of list argument types
list-argument
	# static arg list demo
	static: echo 
		:one-of-a-static-list:list:first-element|second|third|etc
	# arg list from function demo
	from-function: echo
		:arg-generated-by-function:eval:create_arg_options
	# arg list from variable demo
	from-variable: echo
		:arg-from-variable:list:$ARGUMENT_OPTIONS
# example to test failing command exit code
false: false
return2: return 2

# example of deeper structure
install
	jar
		from
			file: echo
				:jar-file:FILE
			maven: echo
				:mvn-coords:list:a|b|c
	war
		from
			file: echo
				:war-file:FILE
			maven: ~/bin/install-maven-war.sh
				:mvn-coords:list:a|b|c

# kubernetes admin shortcuts
# try: source this file, then type 'k' and hit TAB
k
	get
		pods: kubectl get pods -o wide
		services: kubectl get svc
		nodes: kubectl get nodes -o wide
	logs
		default: kubectl logs -f -n default \1
			:pod:eval:get_pods default
		kube-system: kubectl logs -f -n kube-system \1
			:pod:eval:get_pods kube-system
	restart
		default: kubectl rollout restart deployment/\1 -n default
			:deployment:eval:get_deployments default
		kube-system: kubectl rollout restart deployment/\1 -n kube-system
			:deployment:eval:get_deployments kube-system
test-a-file: echo
    :path:FILE
test-dir: echo
    :path:DIR
test-string: echo
    :name:STRING
test-integer: echo
    :num:INTEGER
test-range: echo
    :level:int_range:1-5
test-envvar: echo
    :var:ENVVAR
test-user: echo
    :user:USER
test-group: echo
    :group:GROUP
test-ssh-host: echo
    :host:SSH_HOST
test-blkdev: echo
    :dev:BLKDEV
test-service: echo
    :svc:SERVICE
test-file-or-dir: echo
    :path:FILE_OR_DIR
test-glob-a-file: echo
    :path:FILE:*.txt
test-glob-file-or-dir: echo
    :path:FILE_OR_DIR:*.txt
file-then-string: echo
    :file:FILE
    :name:list:alpha|bravo|charlie
