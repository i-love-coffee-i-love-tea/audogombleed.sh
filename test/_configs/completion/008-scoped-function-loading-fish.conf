[env]
__CLI_CFG_EXEC_SILENT="y"

[env.fish]
function create_cmd_words
    echo "thievery"
    echo "corporation"
end
function create_arg_options
    echo "opt1"
    echo "opt2"
end
function track_alpha
    echo "alpha" >> /tmp/fish-test-call.log
    echo "a1 a2"
end
function track_beta
    echo "beta" >> /tmp/fish-test-call.log
    echo "b1 b2"
end
function track_gamma
    echo "gamma" >> /tmp/fish-test-call.log
    echo "c1 c2"
end

[commands]
echo: \0 \2 \1
var-expansion
function-expansion
list-expansion
list-argument
false: false
return2: return 2
install
k
alpha-cmd
    &track_alpha: echo \0
beta-cmd
    &track_beta: echo \0
gamma-cmd
    &track_gamma: echo \0
