[env]
# Dev CLI for managing the derakht.sh project.
# Symlink and source:
#   ln -sf derakht.sh dev && source ./dev
# Config lives at ~/.dev.conf (or copy this file there).

# -- argument completion functions --

function _dev_list_bats_files() {
	local f
	for f in test/*/*.bats; do
		# Return category/name format
		local dir=$(basename "$(dirname "$f")")
		local name=$(basename "$f" .bats)
		echo "${dir}/${name}"
	done
}

function _dev_list_tapes() {
	local f
	for f in demo/*.tape; do
		basename "$f"
	done
}

function _dev_list_bash_versions() {
	echo "4.2.53"
	echo "4.3.30"
	echo "4.4.18"
	echo "5.0"
	echo "5.1.16"
	echo "5.2.37"
	echo "5.3"
}

function _dev_complete_docs() {
	local f
	for f in docs/*.md; do
		basename "$f" .md
	done
	for f in docs/dev/*.md; do
		echo "dev/$(basename "$f" .md)"
	done
}

function _dev_print_docs() {
	local _had_noglob=0
	case "$-" in *f*) _had_noglob=1;; esac
	set +o noglob
	local f
	for f in docs/*.md; do
		echo "$f"
	done
	for f in docs/dev/*.md; do
		echo "$f"
	done
	[ "$_had_noglob" = 1 ] && set -o noglob
}

function _dev_open() {
	if [ "$(uname)" = "Darwin" ]; then
		open "$1"
	else
		xdg-open "$1" 2>/dev/null || echo "open: $1"
	fi
}

function _dev_test_all() {
	set +o noglob
	test/_bats/bin/bats test/*/*.bats
	set -o noglob
}

function _dev_test_bash() {
	set +o noglob
	test/_bats/bin/bats test/*/*-bash.bats
	set -o noglob
}

function _dev_test_zsh() {
	set +o noglob
	test/_bats/bin/bats test/*/*-zsh.bats
	set -o noglob
}

function _dev_test_file() {
	test/_bats/bin/bats "test/$1.bats"
}

function _dev_test_bench() {
	test/_bats/bin/bats test/execution/benchmark-bash.bats
}

[env.fish]
# Fish-native equivalents of the bash functions above.
# These are evaluated by derakht.fish when the config is loaded.

function _dev_list_bats_files
	for f in test/*.bats
		basename $f .bats
	end
end

function _dev_list_tapes
	for f in demo/*.tape
		basename $f
	end
end

function _dev_list_bash_versions
	echo "4.2.53"
	echo "4.3.30"
	echo "4.4.18"
	echo "5.0"
	echo "5.1.16"
	echo "5.2.37"
	echo "5.3"
end

function _dev_complete_docs
	for f in docs/*.md
		basename $f .md
	end
	for f in docs/dev/*.md
		echo "dev/"(basename $f .md)
	end
end

function _dev_print_docs
	for f in docs/*.md
		echo $f
	end
	for f in docs/dev/*.md
		echo $f
	end
end

function _dev_open
	if test (uname) = "Darwin"
		open $argv[1]
	else
		xdg-open $argv[1] 2>/dev/null; or echo "open: $argv[1]"
	end
end

function _dev_test_all
	test/bats/bin/bats test/*.bats
end

function _dev_test_bash
	test/bats/bin/bats test/*-bash.bats
end

function _dev_test_zsh
	test/bats/bin/bats test/*-zsh.bats test/zsh-completion-descriptions.bats
end

function _dev_test_file
	test/bats/bin/bats "test/$argv[1].bats"
end

function _dev_test_bench
	test/bats/bin/bats test/benchmark-bash.bats
end

[commands]
#                      __                            __    __              __
#     ____ ___  ______/ /___  ____ _____  ____ ___  / /_  / /__  ___  ____/ /
#    / __ `/ / / / __  / __ \/ __ `/ __ \/ __ `__ \/ __ \/ / _ \/ _ \/ __  /
#   / /_/ / /_/ / /_/ / /_/ / /_/ / /_/ / / / / / / /_/ / /  __/  __/ /_/ /
#   \__,_/\__,_/\__,_/\____/\__, /\____/_/ /_/ /_/_.___/_/\___/\___/\__,_/
#                          /____/
#   project dev cli

# run tests
test
	# run all tests (bash + zsh)
	all: _dev_test_all
	# run bash tests only
	bash: _dev_test_bash
	# run zsh tests only
	zsh: _dev_test_zsh
	# run a specific test file
	file: _dev_test_file \1
		:file:eval:_dev_list_bats_files
	# build bash from source and run tests against it
	compat: bash test/bash-compat.sh \1
		:version:eval:_dev_list_bash_versions
	# run benchmark tests
	bench: _dev_test_bench
	# run completion tests only
	completion: test/_bats/bin/bats test/completion/*.bats
	# run execution tests only
	execution: test/_bats/bin/bats test/execution/*.bats
	# run config tests only
	config: test/_bats/bin/bats test/config/*.bats
	# run help tests only
	help: test/_bats/bin/bats test/help/*.bats
	# run security tests only
	security: test/_bats/bin/bats test/security/*.bats
	# run integration tests only
	integration: test/_bats/bin/bats test/integration/*.bats

# record terminal demos with vhs
demo
	# record a single tape to mp4
	record: demo/record-tape.sh \1
		:tape:eval:_dev_list_tapes
	# record all tapes
	record-all: demo/record-all.sh

# run shellcheck on the main script
lint: shellcheck derakht.sh

# code coverage (requires kcov)
coverage
	# run bash tests with coverage and generate report
	run: ./coverage.sh
	# run and open HTML report in browser
	open: ./coverage.sh --open
	# remove coverage data
	clean: rm -rf coverage/

# embedded awk script development
awk
	# embed both parser and validator (defaults from lib/)
	embed: bash lib/embed-awk.sh all
	# embed parser only
	embed-parser: bash lib/embed-awk.sh parser \1
		:file:FILE?:lib/derakht-parser.awk
	# embed validator only
	embed-validator: bash lib/embed-awk.sh validator \1
		:file:FILE?:lib/derakht-validator.awk
	# export embedded awk script to cli.awk
	export: ./testcli --cli-print-awk-script > cli.awk
	# lint the exported awk script
	lint: awk --lint -f cli.awk
	# run the awk script with arguments
	run: ./testcli --cli-run-awk-script \1
		:args:list:output=commands|output=command_names|output=help|output=env|output=command_word_functions
	# diff exported vs embedded awk
	diff: diff <(./testcli --cli-print-awk-script) cli.awk

# bump version, tag, and commit
release: ./release.sh \1
	:version:STRING

# build distribution packages
build
	# build unsigned .deb (for testing)
	deb: ./build-deb.sh
	# build signed .deb (for distribution)
	deb-sign: ./build-deb.sh --sign

# print the current version
version: grep '^__CLI_VERSION=' derakht.sh | cut -d'"' -f2

# open debian/changelog in $EDITOR
changelog: $EDITOR debian/changelog

# view the manpage
man: man ./derakht.1

# browse project documentation
docs
	# list available docs
	list: _dev_print_docs
	# open a doc file in the browser (e.g. docs open 02-configuration)
	open: _dev_open docs/\1.md
		:file:eval:_dev_complete_docs
	# open docs directory in file manager
	dir: _dev_open docs/

# remove generated files
clean
	# remove test artifacts
	test: rm -f ./testcli ~/.testcli.conf
	# remove exported awk script
	awk: rm -f cli.awk
	# remove all generated files
	all: rm -f ./testcli ~/.testcli.conf cli.awk && rm -rf coverage/
