name: Code Coverage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: "coverage: bash + zsh"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-dev libiberty-dev libdw-dev \
            libcurl4-openssl-dev cmake zsh

      - name: Cache kcov build
        id: cache-kcov
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: /usr/local/bin/kcov
          key: kcov-v42

      - name: Build kcov
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/SimonKagstrom/kcov.git /tmp/kcov
          cd /tmp/kcov
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build build -j"$(nproc)"
          sudo cmake --install build
          kcov --version

      - name: Run bash tests with coverage
        run: |
          mkdir -p coverage/bash
          kcov \
            --bash-method=DEBUG \
            --bash-parse-files-in-dir="$(pwd)" \
            --include-pattern=derakht.sh \
            --exclude-pattern=test,bats \
            coverage/bash \
            test/_bats/bin/bats test/*/*-bash.bats test/*/*-all.bats

      - name: Run zsh tests with coverage
        run: |
          mkdir -p coverage/zsh
          # kcov doesn't support zsh natively. Run zsh tests normally to
          # verify they pass; bash coverage already exercises the shared code.
          test/_bats/bin/bats test/*/*-zsh.bats test/*/*-all.bats

      - name: Merge coverage data
        run: |
          # kcov writes per-bats-file results; merge them into one report
          mkdir -p coverage/merged
          kcov --merge coverage/merged coverage/bash

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/merged/
          retention-days: 30

      - name: Summary
        run: |
          if [ -f coverage/merged/derakht.sh/coverage.json ]; then
            read -r pct covered total <<< $(python3 -c "
          import json
          d = json.load(open('coverage/merged/derakht.sh/coverage.json'))
          print(f\"{d['percent_covered']:.1f} {d['covered_lines']} {d['total_lines']}\")
          " 2>/dev/null || echo "N/A 0 0")
            echo "## Coverage: $pct" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**$covered / $total** lines covered" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Download the \`coverage-report\` artifact for the full HTML report." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Coverage: no data generated" >> "$GITHUB_STEP_SUMMARY"
          fi
