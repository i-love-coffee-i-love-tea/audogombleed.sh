name: "Automated Tests"
on: [push, pull_request, workflow_dispatch]

permissions:
  id-token: write
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Test jobs ──────────────────────────────────────────────────────
  test-ubuntu-bash:
    name: "test: Ubuntu bash ${{ matrix.bash-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash-version:
          - "4.2.53"
          - "4.3.30"
          - "4.4.18"
          - "5.0"
          - "5.1.16"
          - "5.2.37"
          - "5.3"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Cache apt packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/apt
          key: apt-bash-compat-${{ matrix.bash-version }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev
      - name: "Build & test bash ${{ matrix.bash-version }}"
        run: bash test/bash-compat.sh "${{ matrix.bash-version }}"
      - name: Report
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (Ubuntu bash ${{ matrix.bash-version }})"
          path: report.xml
          reporter: java-junit
          fail-on-error: true

  test-ubuntu-zsh:
    name: "test: Ubuntu zsh"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Cache apt packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/apt
          key: apt-ubuntu-zsh
      - name: Ensure zsh is installed
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Run zsh tests
        run: test/_bats/bin/bats test/*/*-zsh.bats test/*/*-all.bats --formatter junit | tee report-zsh.xml
      - name: Report
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (Ubuntu zsh)"
          path: report-zsh.xml
          reporter: java-junit
          fail-on-error: true

  test-macos:
    name: "test: macOS zsh"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      # macOS ships bash 3.2 at /bin/bash; bats needs 4.2+
      # awk variants: needed for awk-posix-compat tests
      # coreutils: only for gdate in benchmark tests (not a runtime dependency)
      - name: Cache Homebrew packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/bash
            /opt/homebrew/Cellar/gawk
            /opt/homebrew/Cellar/mawk
            /opt/homebrew/Cellar/coreutils
          key: brew-macos-${{ runner.os }}-${{ runner.arch }}
      - name: Install test dependencies
        run: |
          brew install bash gawk mawk coreutils
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Smoke test
        run: |
          ln -sf ./derakht.sh ./testcli
          cp example.conf ~/.testcli.conf
          zsh ./testcli echo hello world
          bash ./testcli echo hello world
          rm -f ./testcli ~/.testcli.conf
      - name: Run zsh tests
        env:
          MAX_EXEC_MS: 250
          MAX_COMPLETION_MS: 250
          MAX_LARGE_COMPLETION_MS: 350
        run: test/_bats/bin/bats test/*/*-zsh.bats test/*/*-all.bats --formatter junit | tee report-macos-zsh.xml
      - name: Report
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (macOS zsh)"
          path: report-macos-zsh.xml
          reporter: java-junit
          fail-on-error: true

  test-freebsd:
    name: "test: FreeBSD bash+zsh"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y bash zsh git gawk coreutils
            mount -t fdescfs fdesc /dev/fd
            git config --global --add safe.directory /home/runner/work/derakht-cli/derakht-cli
          run: |
            {
            echo "=== FreeBSD version ==="
            uname -a
            echo "=== bash version ==="
            bash --version | head -1
            echo "=== zsh version ==="
            zsh --version
            echo "=== gawk version ==="
            gawk --version | head -1
            echo "=== gdate version ==="
            gdate --version | head -1
            echo "=== stat test ==="
            touch /tmp/test-stat.txt
            chmod 777 /tmp/test-stat.txt
            stat -L -f '%p' /tmp/test-stat.txt
            echo "=== readlink test ==="
            ln -sf /tmp/test-stat.txt /tmp/test-link.txt
            readlink -f /tmp/test-link.txt
            # Smoke test
            ln -sf ./derakht.sh ./testcli
            cp example.conf ~/.testcli.conf
            bash ./testcli echo hello world
            zsh ./testcli echo hello world
            rm -f ./testcli ~/.testcli.conf
            # Benchmark thresholds (VM is slower than native)
            export MAX_EXEC_MS=200
            export MAX_COMPLETION_MS=200
            export MAX_LARGE_COMPLETION_MS=300
            # Run bash tests (allow failures to capture report)
            test/_bats/bin/bats test/*/*-bash.bats test/*/*-all.bats --formatter junit | tee report-freebsd-bash.xml || true
            # Run zsh tests (allow failures to capture report)
            test/_bats/bin/bats test/*/*-zsh.bats test/*/*-all.bats --formatter junit | tee report-freebsd-zsh.xml || true
            } 2>&1
      - name: Report (bash)
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (FreeBSD bash)"
          path: report-freebsd-bash.xml
          reporter: java-junit
          fail-on-error: true
      - name: Report (zsh)
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (FreeBSD zsh)"
          path: report-freebsd-zsh.xml
          reporter: java-junit
          fail-on-error: true

  test-wsl:
    name: "test: WSL Ubuntu bash+zsh"
    runs-on: windows-latest
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf input
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Setup WSL
        uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
      - name: Run tests in WSL
        shell: powershell
        env:
          WSLENV: GITHUB_WORKSPACE
        run: |
          $wslPath = "${{ github.workspace }}" -replace '\\','/' -replace '^([A-Z]):', '/mnt/$1'
          $wslPath = $wslPath.ToLower()
          $script = "set -eo pipefail`ncd `"$wslPath`"`napt-get update -qq`napt-get install -y -qq bash zsh gawk git`nln -sf ./derakht.sh ./testcli`ncp example.conf ~/.testcli.conf`nbash ./testcli echo hello world`nzsh ./testcli echo hello world`nrm -f ./testcli ~/.testcli.conf`nexport MAX_EXEC_MS=400 MAX_COMPLETION_MS=400 MAX_LARGE_COMPLETION_MS=600`ntest/_bats/bin/bats test/*/*-bash.bats test/*/*-all.bats --filter '!ACK=y' --formatter junit | tee report-wsl-bash.xml`ntest/_bats/bin/bats test/*/*-zsh.bats test/*/*-all.bats --formatter junit | tee report-wsl-zsh.xml"
          $script = $script -replace "`r`n","`n" -replace "`r","`n"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($script)
          $encoded = [Convert]::ToBase64String($bytes)
          wsl -d Ubuntu-24.04 -- bash -c "echo '$encoded' | base64 -d | bash"
      - name: Report (bash)
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (WSL bash)"
          path: report-wsl-bash.xml
          reporter: java-junit
          fail-on-error: true
      - name: Report (zsh)
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (WSL zsh)"
          path: report-wsl-zsh.xml
          reporter: java-junit
          fail-on-error: true

  # ── Package build jobs ─────────────────────────────────────────────
  pkg-arch:
    name: "pkg: Arch Linux PKGBUILD"
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install dependencies
        run: pacman -Syu --noconfirm bash gawk git base-devel
      - name: Test PKGBUILD build
        run: |
          cd packaging/arch
          # Extract version from PKGBUILD
          pkgver=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          # Create a source tarball matching GitHub's archive layout
          mkdir /tmp/src && cp -a ../.. "/tmp/src/derakht-cli-${pkgver}"
          tar czf "/tmp/derakht-cli-${pkgver}.tar.gz" -C /tmp/src "derakht-cli-${pkgver}"
          rm -rf /tmp/src
          # Update source to use local tarball
          sed -i "s|source=.*|source=(\"derakht-cli-${pkgver}.tar.gz::file:///tmp/derakht-cli-${pkgver}.tar.gz\")|" PKGBUILD
          sed -i "s|sha256sums=.*|sha256sums=('SKIP')|" PKGBUILD
          # Build as non-root user (makepkg refuses to run as root)
          useradd -m builder
          chown -R builder:builder "/tmp/derakht-cli-${pkgver}.tar.gz" "$GITHUB_WORKSPACE"
          su builder -c "cd $GITHUB_WORKSPACE/packaging/arch && makepkg --noconfirm --nodeps"

  pkg-nix:
    name: "pkg: Nix"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: Build Nix package
        run: nix-build packaging/nix -A derakht-cli --no-out-link
        continue-on-error: true

  pkg-homebrew:
    name: "pkg: Homebrew formula"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test formula install
        run: |
          # Create a proper tap
          brew tap-new i-love-coffee-i-love-tea/derakht-cli
          cp packaging/homebrew/derakht-cli.rb "$(brew --repository)/Library/Taps/i-love-coffee-i-love-tea/homebrew-derakht-cli/Formula/"
          # Extract version from formula URL (e.g., v2.1.0.tar.gz -> 2.1.0)
          pkgver=$(grep 'url ' packaging/homebrew/derakht-cli.rb | sed 's|.*v\([0-9.]*\)\.tar\.gz.*|\1|')
          # Replace the GitHub URL with a local path for testing
          tar czf "/tmp/derakht-cli-${pkgver}.tar.gz" .
          sha=$(shasum -a 256 "/tmp/derakht-cli-${pkgver}.tar.gz" | cut -d' ' -f1)
          formula="$(brew --repository)/Library/Taps/i-love-coffee-i-love-tea/homebrew-derakht-cli/Formula/derakht-cli.rb"
          sed -i '' "s|url .*|url \"file:///tmp/derakht-cli-${pkgver}.tar.gz\"|" "$formula"
          sed -i '' "s|sha256 .*|sha256 \"$sha\"|" "$formula"
          brew install --build-from-source i-love-coffee-i-love-tea/derakht-cli/derakht-cli
          derakht --version

  pkg-rpm:
    name: "pkg: RPM (Fedora)"
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build RPM
        run: |
          dnf install -y rpm-build rpmdevtools
          rpmdev-setuptree
          # Extract version from spec file
          pkgver=$(grep '^Version:' packaging/rpm/derakht-cli.spec | awk '{print $2}')
          # Create source tarball matching GitHub's archive layout
          mkdir /tmp/src && cp -a . "/tmp/src/derakht-cli-${pkgver}"
          tar czf ~/rpmbuild/SOURCES/derakht-cli-${pkgver}.tar.gz -C /tmp/src "derakht-cli-${pkgver}"
          rm -rf /tmp/src
          rpmbuild -ba packaging/rpm/derakht-cli.spec
          # Verify the RPM was built
          rpm -qip ~/rpmbuild/RPMS/noarch/derakht-cli-${pkgver}-1.*.rpm

  pkg-gentoo:
    name: "pkg: Gentoo ebuild"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate ebuild
        run: |
          # Find the ebuild file (version in filename)
          ebuild=$(ls packaging/gentoo/derakht-cli-*.ebuild | head -1)
          if [ -z "$ebuild" ]; then
            echo "No ebuild found"
            exit 1
          fi
          # Check bash syntax
          bash -n "$ebuild"
          # Check required ebuild variables are defined
          for var in DESCRIPTION HOMEPAGE SRC_URI LICENSE SLOT KEYWORDS; do
            grep -q "^${var}=" "$ebuild" || { echo "Missing $var"; exit 1; }
          done
          # Check required functions exist
          grep -q "^src_install()" "$ebuild" || { echo "Missing src_install"; exit 1; }
          echo "ebuild validation passed: $ebuild"
