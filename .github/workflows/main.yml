name: "Automated Tests"
on: [push, pull_request, workflow_dispatch]
permissions:
  id-token: write
  contents: read
  checks: write
jobs:
  bash-compat:
    name: "Ubuntu bash ${{ matrix.bash-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash-version:
          - "4.2.53"
          - "4.3.30"
          - "4.4.18"
          - "5.0"
          - "5.1.16"
          - "5.2.37"
          - "5.3"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev
      - name: "Build & test bash ${{ matrix.bash-version }}"
        run: bash test/bash-compat.sh "${{ matrix.bash-version }}"
      - name: Report
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (Ubuntu bash ${{ matrix.bash-version }})"
          path: report.xml
          reporter: java-junit
          fail-on-error: true

  zsh-compat:
    name: "Ubuntu zsh tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Ensure zsh is installed
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Run zsh tests
        run: test/bats/bin/bats test/*-zsh.bats test/*-all.bats --formatter junit | tee report-zsh.xml
      - name: Report
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (Ubuntu zsh)"
          path: report-zsh.xml
          reporter: java-junit
          fail-on-error: true

  macos:
    name: "macOS zsh tests"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      # macOS ships bash 3.2 at /bin/bash; bats needs 4.2+
      # awk variants: needed for awk-posix-compat tests
      # coreutils: only for gdate in benchmark tests (not a runtime dependency)
      - name: Install test dependencies
        run: |
          brew install bash gawk mawk coreutils
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Smoke test
        run: |
          ln -sf ./audogombleed.sh ./testcli
          cp example.conf ~/.testcli.conf
          zsh ./testcli echo hello world
          bash ./testcli echo hello world
          rm -f ./testcli ~/.testcli.conf
      - name: Run zsh tests
        env:
          MAX_EXEC_MS: 200
          MAX_COMPLETION_MS: 200
          MAX_LARGE_COMPLETION_MS: 300
        run: test/bats/bin/bats test/*-zsh.bats test/*-all.bats --formatter junit | tee report-macos-zsh.xml
      - name: Report
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (macOS zsh)"
          path: report-macos-zsh.xml
          reporter: java-junit
          fail-on-error: true

  freebsd:
    name: "FreeBSD bash+zsh tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y bash zsh git gawk coreutils
            mount -t fdescfs fdesc /dev/fd
            git config --global --add safe.directory /home/runner/work/audogombleed.sh/audogombleed.sh
          run: |
            {
            echo "=== FreeBSD version ==="
            uname -a
            echo "=== bash version ==="
            bash --version | head -1
            echo "=== zsh version ==="
            zsh --version
            echo "=== gawk version ==="
            gawk --version | head -1
            echo "=== gdate version ==="
            gdate --version | head -1
            echo "=== stat test ==="
            touch /tmp/test-stat.txt
            chmod 777 /tmp/test-stat.txt
            stat -L -f '%p' /tmp/test-stat.txt
            echo "=== readlink test ==="
            ln -sf /tmp/test-stat.txt /tmp/test-link.txt
            readlink -f /tmp/test-link.txt
            # Smoke test
            ln -sf ./audogombleed.sh ./testcli
            cp example.conf ~/.testcli.conf
            bash ./testcli echo hello world
            zsh ./testcli echo hello world
            rm -f ./testcli ~/.testcli.conf
            # Benchmark thresholds (VM is slower than native)
            export MAX_EXEC_MS=200
            export MAX_COMPLETION_MS=200
            export MAX_LARGE_COMPLETION_MS=300
            # Run bash tests (allow failures to capture report)
            test/bats/bin/bats test/*-bash.bats test/*-all.bats --formatter junit | tee report-freebsd-bash.xml || true
            # Run zsh tests (allow failures to capture report)
            test/bats/bin/bats test/*-zsh.bats test/*-all.bats --formatter junit | tee report-freebsd-zsh.xml || true
            } 2>&1
      - name: Report (bash)
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (FreeBSD bash)"
          path: report-freebsd-bash.xml
          reporter: java-junit
          fail-on-error: true
      - name: Report (zsh)
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (FreeBSD zsh)"
          path: report-freebsd-zsh.xml
          reporter: java-junit
          fail-on-error: true

  archlinux:
    name: "Arch Linux PKGBUILD build"
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install dependencies
        run: pacman -Syu --noconfirm bash gawk git base-devel
      - name: Test PKGBUILD build
        run: |
          cd packaging/arch
          # Create a source tarball that matches GitHub's archive layout
          # (files inside an audogombleed.sh-X.Y.Z/ directory)
          tar czf /tmp/audogombleed-2.0.0.tar.gz -C ../.. --transform='s,^\./,audogombleed.sh-2.0.0/,' .
          # Update source to use local tarball
          sed -i "s|source=.*|source=(\"audogombleed-2.0.0.tar.gz::file:///tmp/audogombleed-2.0.0.tar.gz\")|" PKGBUILD
          sed -i "s|sha256sums=.*|sha256sums=('SKIP')|" PKGBUILD
          # Build as non-root user (makepkg refuses to run as root)
          useradd -m builder
          chown -R builder:builder /tmp/audogombleed-2.0.0.tar.gz "$GITHUB_WORKSPACE"
          su builder -c "cd $GITHUB_WORKSPACE/packaging/arch && makepkg --noconfirm --nodeps"

  nix:
    name: "Nix package build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: Build Nix package
        run: nix-build packaging/nix -A audogombleed --no-out-link
        continue-on-error: true

  homebrew:
    name: "Homebrew formula build"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test formula install
        run: |
          # Create a proper tap
          brew tap-new i-love-coffee-i-love-tea/audogombleed
          cp packaging/homebrew/audogombleed.rb "$(brew --repository)/Library/Taps/i-love-coffee-i-love-tea/homebrew-audogombleed/Formula/"
          # Replace the GitHub URL with a local path for testing
          tar czf /tmp/audogombleed-2.0.0.tar.gz .
          sha=$(shasum -a 256 /tmp/audogombleed-2.0.0.tar.gz | cut -d' ' -f1)
          formula="$(brew --repository)/Library/Taps/i-love-coffee-i-love-tea/homebrew-audogombleed/Formula/audogombleed.rb"
          sed -i '' "s|url .*|url \"file:///tmp/audogombleed-2.0.0.tar.gz\"|" "$formula"
          sed -i '' "s|sha256 .*|sha256 \"$sha\"|" "$formula"
          brew install --build-from-source i-love-coffee-i-love-tea/audogombleed/audogombleed
          audogombleed --version

  rpm:
    name: "RPM package build"
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build RPM
        run: |
          dnf install -y rpm-build rpmdevtools
          rpmdev-setuptree
          # Create source tarball matching GitHub's archive layout
          tar czf ~/rpmbuild/SOURCES/audogombleed-2.0.0.tar.gz -C .. --transform='s,^\./,audogombleed.sh-2.0.0/,' .
          rpmbuild -ba packaging/rpm/audogombleed.spec
          # Verify the RPM was built
          rpm -qip ~/rpmbuild/RPMS/noarch/audogombleed-2.0.0-1.*.rpm

  gentoo:
    name: "Gentoo ebuild validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate ebuild
        run: |
          ebuild=packaging/gentoo/audogombleed-2.0.0.ebuild
          # Check bash syntax
          bash -n "$ebuild"
          # Check required ebuild variables are defined
          for var in DESCRIPTION HOMEPAGE SRC_URI LICENSE SLOT KEYWORDS; do
            grep -q "^${var}=" "$ebuild" || { echo "Missing $var"; exit 1; }
          done
          # Check required functions exist
          grep -q "^src_install()" "$ebuild" || { echo "Missing src_install"; exit 1; }
          echo "ebuild validation passed"

  wsl:
    name: "WSL Ubuntu tests"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Setup WSL
        uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
      - name: Run tests in WSL
        shell: powershell
        env:
          WSLENV: GITHUB_WORKSPACE
        run: |
          $script = "set -eo pipefail`ncd `"$(wslpath `"${{ github.workspace }}`")`"`napt-get update -qq`napt-get install -y -qq bash zsh gawk git`nln -sf ./audogombleed.sh ./testcli`ncp example.conf ~/.testcli.conf`nbash ./testcli echo hello world`nzsh ./testcli echo hello world`nrm -f ./testcli ~/.testcli.conf`ntest/bats/bin/bats test/*-bash.bats test/*-all.bats --formatter junit | tee report-wsl-bash.xml`ntest/bats/bin/bats test/*-zsh.bats test/*-all.bats --formatter junit | tee report-wsl-zsh.xml"
          $script = $script -replace "`r`n","`n" -replace "`r","`n"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($script)
          $encoded = [Convert]::ToBase64String($bytes)
          wsl -d Ubuntu-24.04 -- bash -c "echo '$encoded' | base64 -d | bash"
      - name: Report (bash)
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (WSL bash)"
          path: report-wsl-bash.xml
          reporter: java-junit
          fail-on-error: true
      - name: Report (zsh)
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (WSL zsh)"
          path: report-wsl-zsh.xml
          reporter: java-junit
          fail-on-error: true
