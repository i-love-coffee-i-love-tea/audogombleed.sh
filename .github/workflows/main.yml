name: "Automated Tests"
on: [push, pull_request, workflow_dispatch]
permissions:
  id-token: write
  contents: read
  checks: write
jobs:
  bash-compat:
    name: "bash ${{ matrix.bash-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash-version:
          - "4.2.53"
          - "4.3.30"
          - "4.4.18"
          - "5.0"
          - "5.1.16"
          - "5.2.37"
          - "5.3"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev
      - name: "Build & test bash ${{ matrix.bash-version }}"
        run: bash test/bash-compat.sh "${{ matrix.bash-version }}"
      - name: Report
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (bash ${{ matrix.bash-version }})"
          path: report.xml
          reporter: java-junit
          fail-on-error: true

  zsh-compat:
    name: "zsh tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Ensure zsh is installed
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Run zsh tests
        run: test/bats/bin/bats test/*-zsh.bats test/*-all.bats --formatter junit > report-zsh.xml
      - name: Report
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (zsh)"
          path: report-zsh.xml
          reporter: java-junit
          fail-on-error: true

  macos:
    name: "macOS zsh tests"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      # macOS ships bash 3.2 at /bin/bash; bats needs 4.2+
      # awk variants: needed for awk-posix-compat tests
      # coreutils: only for gdate in benchmark tests (not a runtime dependency)
      - name: Install test dependencies
        run: |
          brew install bash gawk mawk coreutils
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Smoke test
        run: |
          ln -sf ./audogombleed.sh ./testcli
          cp example.conf ~/.testcli.conf
          zsh ./testcli echo hello world
          bash ./testcli echo hello world
          rm -f ./testcli ~/.testcli.conf
      - name: Run zsh tests
        run: test/bats/bin/bats test/*-zsh.bats test/*-all.bats --formatter junit > report-macos-zsh.xml
      - name: Report
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: always()
        with:
          name: "BATS Test Report (macOS zsh)"
          path: report-macos-zsh.xml
          reporter: java-junit
          fail-on-error: true
