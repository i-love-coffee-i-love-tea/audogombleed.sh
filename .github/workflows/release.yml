name: "Release"
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Quick smoke test (gate for all builds) ────────────────────────
  test:
    name: "test: smoke"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Cache apt packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/apt
          key: apt-release-test
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Smoke test (bash + zsh)
        run: |
          ln -sf ./audogombleed.sh ./testcli
          cp example.conf ~/.testcli.conf
          bash ./testcli echo hello world
          zsh ./testcli echo hello world
          rm -f ./testcli ~/.testcli.conf
      - name: Run tests
        run: test/_bats/bin/bats test/*/*-bash.bats test/*/*-all.bats --tap 2>&1 | tail -5

  # ── Helper: extract version from tag ──────────────────────────────
  version:
    name: "extract version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # ── Build + test .deb (Debian/Ubuntu) ─────────────────────────────
  build-deb:
    name: "pkg: .deb"
    runs-on: ubuntu-latest
    needs: [test, version]
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Cache apt packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/apt
          key: apt-release-deb
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev debhelper zsh
      - name: Build .deb
        run: ./release.d/70-build-deb.sh
      - name: Install .deb
        run: sudo dpkg -i ../audogombleed_${PKG_VERSION}_all.deb
      - name: Test installed binary
        run: |
          audogombleed --version | grep -q "$PKG_VERSION"
          echo "--- version OK ---"
      - name: Run bats tests against installed binary
        run: |
          export CLI_UNDER_TEST=/usr/bin/audogombleed
          test/_bats/bin/bats test/*/*-bash.bats test/*/*-all.bats --tap 2>&1 | tail -20
      - name: Upload .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-deb
          path: ../audogombleed_*_all.deb
          retention-days: 5

  # ── Build + test .rpm (Fedora) ────────────────────────────────────
  build-rpm:
    name: "pkg: .rpm"
    runs-on: ubuntu-latest
    needs: [test, version]
    container:
      image: fedora:latest
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Install build dependencies
        run: dnf install -y rpm-build rpmdevtools bash gawk zsh git
      - name: Build .rpm
        run: |
          rpmdev-setuptree
          mkdir /tmp/src && cp -a . "/tmp/src/audogombleed.sh-${PKG_VERSION}"
          tar czf ~/rpmbuild/SOURCES/audogombleed-${PKG_VERSION}.tar.gz \
            -C /tmp/src "audogombleed.sh-${PKG_VERSION}"
          rm -rf /tmp/src
          rpmbuild -ba packaging/rpm/audogombleed.spec
      - name: Install .rpm
        run: rpm -ivh ~/rpmbuild/RPMS/noarch/audogombleed-${PKG_VERSION}-1.*.rpm
      - name: Test installed binary
        run: |
          audogombleed --version | grep -q "$PKG_VERSION"
          echo "--- version OK ---"
      - name: Run bats tests against installed binary
        run: |
          export CLI_UNDER_TEST=/usr/bin/audogombleed
          test/_bats/bin/bats test/*/*-bash.bats test/*/*-all.bats --tap 2>&1 | tail -20
      - name: Upload .rpm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-rpm
          path: ~/rpmbuild/RPMS/noarch/audogombleed-*.rpm
          retention-days: 5

  # ── Build + test .pkg.tar.zst (Arch Linux) ────────────────────────
  build-arch:
    name: "pkg: Arch"
    runs-on: ubuntu-latest
    needs: [test, version]
    container:
      image: archlinux:latest
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Install dependencies
        run: pacman -Syu --noconfirm bash gawk zsh git base-devel
      - name: Build .pkg.tar.zst
        run: |
          cd packaging/arch
          mkdir /tmp/src && cp -a ../.. "/tmp/src/audogombleed.sh-${PKG_VERSION}"
          tar czf "/tmp/audogombleed-${PKG_VERSION}.tar.gz" -C /tmp/src \
            "audogombleed.sh-${PKG_VERSION}"
          rm -rf /tmp/src
          sed -i "s|source=.*|source=(\"audogombleed-${PKG_VERSION}.tar.gz::file:///tmp/audogombleed-${PKG_VERSION}.tar.gz\")|" PKGBUILD
          sed -i "s|sha256sums=.*|sha256sums=('SKIP')|" PKGBUILD
          useradd -m builder
          chown -R builder:builder "/tmp/audogombleed-${PKG_VERSION}.tar.gz" "$GITHUB_WORKSPACE"
          su builder -c "cd $GITHUB_WORKSPACE/packaging/arch && makepkg --noconfirm --nodeps"
      - name: Install .pkg.tar.zst
        run: pacman -U --noconfirm packaging/arch/audogombleed-*.pkg.tar.zst
      - name: Test installed binary
        run: |
          audogombleed --version | grep -q "$PKG_VERSION"
          echo "--- version OK ---"
      - name: Run bats tests against installed binary
        run: |
          export CLI_UNDER_TEST=/usr/bin/audogombleed
          test/_bats/bin/bats test/*/*-bash.bats test/*/*-all.bats --tap 2>&1 | tail -20
      - name: Upload .pkg.tar.zst
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-arch
          path: packaging/arch/audogombleed-*.pkg.tar.zst
          retention-days: 5

  # ── Build + test .pkg (FreeBSD) ───────────────────────────────────
  build-freebsd:
    name: "pkg: FreeBSD"
    runs-on: ubuntu-latest
    needs: [test, version]
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y bash zsh gawk pkg
            mount -t fdescfs fdesc /dev/fd
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
          run: |
            set -e
            # Build package
            mkdir -p /tmp/pkg/usr/local/bin /tmp/pkg/usr/local/share/man/man1
            cp audogombleed.sh /tmp/pkg/usr/local/bin/audogombleed
            chmod 755 /tmp/pkg/usr/local/bin/audogombleed
            cp audogombleed.1 /tmp/pkg/usr/local/share/man/man1/
            cat > /tmp/pkg/+MANIFEST <<MANIFEST
            name: audogombleed
            version: "${PKG_VERSION}"
            comment: "Create CLIs with auto-completable command trees"
            desc: "Define commands and arguments in a plain text config file. Tab completion, command abbreviation, and help output all come for free."
            origin: shells/audogombleed
            maintainer: github.com@gobuki.org
            www: https://github.com/i-love-coffee-i-love-tea/audogombleed.sh
            prefix: /usr/local
            flatsize: 0
            arch: FreeBSD:14:*
            MANIFEST
            pkg create -m /tmp/pkg -r /tmp/pkg -p /tmp/pkg -o /tmp
            # Install
            pkg add /tmp/audogombleed-${PKG_VERSION}.pkg
            # Test version
            audogombleed --version | grep -q "${PKG_VERSION}"
            echo "--- version OK ---"
            # Run bats tests against installed binary
            export CLI_UNDER_TEST=/usr/local/bin/audogombleed
            export MAX_EXEC_MS=200 MAX_COMPLETION_MS=200 MAX_LARGE_COMPLETION_MS=300
            test/_bats/bin/bats test/*/*-bash.bats test/*/*-all.bats --tap 2>&1 | tail -20
            # Copy package to workspace
            cp /tmp/audogombleed-${PKG_VERSION}.pkg .
      - name: Upload .pkg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-freebsd
          path: audogombleed-*.pkg
          retention-days: 5

  # ── Build + test Homebrew formula (macOS) ─────────────────────────
  build-homebrew:
    name: "pkg: Homebrew"
    runs-on: macos-latest
    needs: [test, version]
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Cache Homebrew packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-release-${{ runner.os }}
      - name: Install dependencies
        run: brew install bash gawk
      - name: Test formula install
        run: |
          # Build tarball
          tar czf "/tmp/audogombleed-${PKG_VERSION}.tar.gz" .
          sha=$(shasum -a 256 "/tmp/audogombleed-${PKG_VERSION}.tar.gz" | cut -d' ' -f1)
          # Update formula
          sed -i '' "s|url .*|url \"file:///tmp/audogombleed-${PKG_VERSION}.tar.gz\"|" \
            packaging/homebrew/audogombleed.rb
          sed -i '' "s|sha256 .*|sha256 \"$sha\"|" \
            packaging/homebrew/audogombleed.rb
          # Create tap and install
          brew tap-new test-user/audogombleed
          cp packaging/homebrew/audogombleed.rb \
            "$(brew --repository)/Library/Taps/test-user/homebrew-audogombleed/Formula/"
          brew install --build-from-source test-user/audogombleed/audogombleed
          # Test version
          audogombleed --version | grep -q "$PKG_VERSION"
          echo "--- version OK ---"
      - name: Run bats tests against installed binary
        env:
          CLI_UNDER_TEST: /usr/local/bin/audogombleed
          MAX_EXEC_MS: 250
          MAX_COMPLETION_MS: 250
          MAX_LARGE_COMPLETION_MS: 350
        run: test/_bats/bin/bats test/*/*-bash.bats test/*/*-all.bats --tap 2>&1 | tail -20
      - name: Upload formula
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-homebrew
          path: packaging/homebrew/audogombleed.rb
          retention-days: 5

  # ── Create GitHub Release (only if all builds pass) ───────────────
  release:
    name: "release: GitHub"
    runs-on: ubuntu-latest
    needs: [build-deb, build-rpm, build-arch, build-freebsd, build-homebrew, version]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/

      - name: Extract release notes
        id: notes
        run: |
          version="${{ needs.version.outputs.version }}"
          notes_file=$(mktemp)
          in_section=false
          while IFS= read -r line; do
            if [[ "$line" == "## $version"* ]]; then
              in_section=true
              continue
            fi
            if $in_section && [[ "$line" == "## "* ]]; then
              break
            fi
            if $in_section; then
              echo "$line" >> "$notes_file"
            fi
          done < CHANGELOG.md
          if [ ! -s "$notes_file" ]; then
            echo "# Release $version" > "$notes_file"
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: List release assets
        run: find dist/ -type f | sort

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=()
          for f in dist/pkg-deb/* dist/pkg-rpm/* dist/pkg-arch/* \
                   dist/pkg-freebsd/* dist/pkg-homebrew/*; do
            [ -f "$f" ] && assets+=("$f")
          done
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            "${assets[@]}"
