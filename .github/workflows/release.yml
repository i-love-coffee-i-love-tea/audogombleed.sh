name: "Release"
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Quick smoke test (gate for all builds) ────────────────────────
  test:
    name: "test: smoke"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Cache apt packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/apt
          key: apt-release-test
      - name: Install zsh and fish
        run: |
          sudo apt-add-repository -y ppa:fish-shell/release-4
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh fish
      - name: Verify version matches tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          script_version=$(grep '^__CLI_VERSION=' derakht.sh | cut -d'"' -f2)
          if [ "$tag_version" != "$script_version" ]; then
            echo "error: tag version ($tag_version) != script version ($script_version)"
            exit 1
          fi
          echo "--- version $tag_version OK ---"
      - name: Smoke test (bash + zsh + fish)
        run: |
          ln -sf "${CLI_SCRIPT_UNDER_TEST:-./derakht.sh}" ./testcli
          cp example.conf ~/.testcli.conf
          bash ./testcli echo hello world
          zsh ./testcli echo hello world
          # Fish smoke test (sourcing, not executing)
          fish -c 'set -g __CLI_PROGNAME testcli; set -g __cli_wrapper_argv echo hello world; source ./derakht.fish'
          rm -f ./testcli ~/.testcli.conf
      - name: Run tests
        run: test/_bats/bin/bats test/*/*-bash.bats test/*/*-all.bats --tap

  # ── Helper: extract version from tag ──────────────────────────────
  version:
    name: "extract version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # ── Build + test .deb (Debian/Ubuntu) ─────────────────────────────
  build-deb:
    name: "pkg: .deb"
    runs-on: ubuntu-latest
    needs: [test, version]
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Cache apt packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/apt
          key: apt-release-deb
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev debhelper build-essential zsh
      - name: Build .deb
        run: ./scripts/release.d/70-build-deb.sh
      - name: Copy .deb into workspace
        run: cp ../derakht-cli_${PKG_VERSION}_all.deb .
      - name: Install .deb
        run: sudo dpkg -i derakht-cli_${PKG_VERSION}_all.deb
      - name: Test installed binary
        run: |
          derakht --version | grep -q "$PKG_VERSION"
          echo "--- version OK ---"
      - name: Run bats tests against installed binary
        run: |
          export CLI_SCRIPT_UNDER_TEST=/usr/bin/derakht
          test/_bats/bin/bats test/*/*-bash.bats test/*/*-all.bats --tap
      - name: Upload .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-deb-${{ needs.version.outputs.version }}
          path: derakht-cli_${{ needs.version.outputs.version }}_all.deb
          retention-days: 5

  # ── Build + test fish .deb (Debian/Ubuntu) ─────────────────────────
  build-deb-fish:
    name: "pkg: .deb (fish)"
    runs-on: ubuntu-latest
    needs: [test, version]
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Install build dependencies
        run: |
          sudo apt-add-repository -y ppa:fish-shell/release-4
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev fish gawk
      - name: Build .deb
        run: |
          pkgdir="/tmp/derakht-cli-fish-${PKG_VERSION}"
          mkdir -p "$pkgdir/DEBIAN" "$pkgdir/usr/bin" "$pkgdir/usr/share/man/man1"
          cat > "$pkgdir/DEBIAN/control" <<EOF
          Package: derakht-cli-fish
          Version: ${PKG_VERSION}
          Architecture: all
          Maintainer: Steffen Kremsler <debian@gobuki.org>
          Depends: fish, gawk | mawk
          Description: Fish shell support for derakht-cli
           Derakht generates shell CLIs from a plain text config file.
           This package provides the fish shell implementation.
          EOF
          install -m 644 derakht.fish "$pkgdir/usr/bin/derakht-fish"
          install -m 644 derakht.1 "$pkgdir/usr/share/man/man1/derakht.1"
          dpkg-deb --build "$pkgdir" "derakht-cli-fish_${PKG_VERSION}_all.deb"
      - name: Install .deb
        run: sudo dpkg -i derakht-cli-fish_${PKG_VERSION}_all.deb
      - name: Test installed file
        run: |
          test -f /usr/bin/derakht-fish
          echo "--- fish package OK ---"
      - name: Run fish tests against installed file
        run: |
          export CLI_SCRIPT_UNDER_TEST=/usr/bin/derakht-fish
          test/_bats/bin/bats test/*/*-fish.bats --tap
      - name: Upload .deb (fish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-deb-fish-${{ needs.version.outputs.version }}
          path: derakht-cli-fish_*_all.deb
          retention-days: 5

  # ── Build + test .rpm (Fedora) ────────────────────────────────────
  build-rpm:
    name: "pkg: .rpm"
    runs-on: ubuntu-latest
    needs: [test, version]
    container:
      image: fedora:latest
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: 0
    steps:
      - name: Install git for checkout
        run: dnf install -y git
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install build dependencies
        run: dnf install -y rpm-build rpmdevtools bash gawk zsh
      - name: Build .rpm
        run: |
          rpmdev-setuptree
          mkdir /tmp/src && cp -a . "/tmp/src/derakht-cli-${PKG_VERSION}"
          ./scripts/make-tarball.sh ~/rpmbuild/SOURCES/derakht-cli-${PKG_VERSION}.tar.gz \
            /tmp/src "derakht-cli-${PKG_VERSION}"
          rm -rf /tmp/src
          rpmbuild -ba packaging/rpm/derakht-cli.spec
      - name: Install .rpm
        run: rpm -ivh ~/rpmbuild/RPMS/noarch/derakht-cli-${PKG_VERSION}-1.*.rpm
      - name: Test installed binary
        run: |
          derakht --version | grep -q "$PKG_VERSION"
          echo "--- version OK ---"
      - name: Run bats tests against installed binary
        run: |
          export CLI_SCRIPT_UNDER_TEST=/usr/bin/derakht
          test/_bats/bin/bats test/*/*-bash.bats test/*/*-all.bats --tap
      - name: Upload .rpm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-rpm-${{ needs.version.outputs.version }}
          path: ~/rpmbuild/RPMS/noarch/derakht-cli-*.rpm
          retention-days: 5

  # ── Build + test .pkg.tar.zst (Arch Linux) ────────────────────────
  build-arch:
    name: "pkg: Arch"
    runs-on: ubuntu-latest
    needs: [test, version]
    container:
      image: archlinux:latest
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: 0
    steps:
      - name: Install git for checkout
        run: pacman -Sy --noconfirm git
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: pacman -Syu --noconfirm bash gawk zsh base-devel
      - name: Build .pkg.tar.zst
        run: |
          cd packaging/arch
          mkdir /tmp/src && cp -a ../.. "/tmp/src/derakht-cli-${PKG_VERSION}"
          ../../scripts/make-tarball.sh "/tmp/derakht-cli-${PKG_VERSION}.tar.gz" \
            /tmp/src "derakht-cli-${PKG_VERSION}"
          rm -rf /tmp/src
          sha=$(sha256sum "/tmp/derakht-cli-${PKG_VERSION}.tar.gz" | cut -d' ' -f1)
          sed -i "s|source=.*|source=(\"derakht-cli-${PKG_VERSION}.tar.gz::file:///tmp/derakht-cli-${PKG_VERSION}.tar.gz\")|" PKGBUILD
          sed -i "s|sha256sums=.*|sha256sums=('$sha')|" PKGBUILD
          useradd -m builder
          chown -R builder:builder "/tmp/derakht-cli-${PKG_VERSION}.tar.gz" "$GITHUB_WORKSPACE"
          su builder -c "cd $GITHUB_WORKSPACE/packaging/arch && makepkg --noconfirm --nodeps"
      - name: Install .pkg.tar.zst
        run: pacman -U --noconfirm packaging/arch/derakht-cli-*.pkg.tar.zst
      - name: Test installed binary
        run: |
          derakht --version | grep -q "$PKG_VERSION"
          echo "--- version OK ---"
      - name: Run bats tests against installed binary
        run: |
          export CLI_SCRIPT_UNDER_TEST=/usr/bin/derakht
          test/_bats/bin/bats test/*/*-bash.bats test/*/*-all.bats --tap
      - name: Upload .pkg.tar.zst
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-arch-${{ needs.version.outputs.version }}
          path: packaging/arch/derakht-cli-*.pkg.tar.zst
          retention-days: 5

  # ── Build + test .pkg (FreeBSD) ───────────────────────────────────
  build-freebsd:
    name: "pkg: FreeBSD"
    runs-on: ubuntu-latest
    needs: [test, version]
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1
        with:
          usesh: true
          envs: PKG_VERSION
          prepare: |
            pkg install -y bash zsh gawk git pkg
            mount -t fdescfs fdesc /dev/fd
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
          run: |
            set -e
            export PATH="/usr/local/bin:$PATH"
            # Stage files relative to prefix (/usr/local)
            mkdir -p /tmp/stage/usr/local/bin /tmp/stage/usr/local/share/man/man1
            cp derakht.sh /tmp/stage/usr/local/bin/derakht
            chmod 755 /tmp/stage/usr/local/bin/derakht
            cp derakht.1 /tmp/stage/usr/local/share/man/man1/
            # UCL manifest
            printf 'name = derakht-cli\nversion = %s\n' "${PKG_VERSION}" > /tmp/manifest.ucl
            printf 'comment = "Create CLIs with auto-completable command trees"\n' >> /tmp/manifest.ucl
            printf 'desc = "Define commands and arguments in a plain text config file. Tab completion, command abbreviation, and help output all come for free."\n' >> /tmp/manifest.ucl
            printf 'origin = shells/derakht\nmaintainer = github.com@gobuki.org\n' >> /tmp/manifest.ucl
            printf 'www = https://github.com/i-love-coffee-i-love-tea/derakht-cli\n' >> /tmp/manifest.ucl
            printf 'prefix = /usr/local\narch = FreeBSD:14:*\ncategories = []\nlicenses = []\n' >> /tmp/manifest.ucl
            # Packing list
            printf 'bin/derakht\nshare/man/man1/derakht.1\n' > /tmp/plist
            pkg create -M /tmp/manifest.ucl -r /tmp/stage -p /tmp/plist -o /tmp
            # Install
            pkg add /tmp/derakht-cli-${PKG_VERSION}.pkg
            # Debug: check what was installed
            echo "--- installed files ---"
            pkg info -l derakht-cli 2>&1 || true
            ls -la /usr/local/bin/derakht* 2>&1 || true
            # Test version
            /usr/local/bin/derakht --version | grep -q "${PKG_VERSION}"
            echo "--- version OK ---"
            # Run bats tests against installed binary
            export CLI_SCRIPT_UNDER_TEST=/usr/local/bin/derakht
            export MAX_EXEC_MS=200 MAX_COMPLETION_MS=200 MAX_LARGE_COMPLETION_MS=300
            test/_bats/bin/bats test/*/*-bash.bats test/*/*-all.bats --tap
            # Copy package to workspace
            cp /tmp/derakht-cli-${PKG_VERSION}.pkg .
      - name: Upload .pkg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-freebsd-${{ needs.version.outputs.version }}
          path: derakht-cli-*.pkg
          retention-days: 5

  # ── Build + test fish .pkg (FreeBSD) ───────────────────────────────
  build-freebsd-fish:
    name: "pkg: FreeBSD (fish)"
    runs-on: ubuntu-latest
    needs: [test, version]
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Build and test fish on FreeBSD
        uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1
        with:
          usesh: true
          envs: PKG_VERSION
          prepare: |
            pkg install -y fish gawk git pkg
            mount -t fdescfs fdesc /dev/fd
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
          run: |
            set -e
            export PATH="/usr/local/bin:$PATH"
            # Stage files relative to prefix (/usr/local)
            mkdir -p /tmp/stage/usr/local/bin /tmp/stage/usr/local/share/man/man1
            cp derakht.fish /tmp/stage/usr/local/bin/derakht-fish
            chmod 755 /tmp/stage/usr/local/bin/derakht-fish
            cp derakht.1 /tmp/stage/usr/local/share/man/man1/
            # UCL manifest
            printf 'name = derakht-cli-fish\nversion = %s\n' "${PKG_VERSION}" > /tmp/manifest.ucl
            printf 'comment = "Fish shell support for derakht-cli"\n' >> /tmp/manifest.ucl
            printf 'desc = "Derakht generates shell CLIs from a plain text config file. This package provides the fish shell implementation."\n' >> /tmp/manifest.ucl
            printf 'origin = shells/derakht-fish\nmaintainer = github.com@gobuki.org\n' >> /tmp/manifest.ucl
            printf 'www = https://github.com/i-love-coffee-i-love-tea/derakht-cli\n' >> /tmp/manifest.ucl
            printf 'prefix = /usr/local\narch = FreeBSD:14:*\ncategories = []\nlicenses = []\n' >> /tmp/manifest.ucl
            # Packing list
            printf 'bin/derakht-fish\nshare/man/man1/derakht.1\n' > /tmp/plist
            pkg create -M /tmp/manifest.ucl -r /tmp/stage -p /tmp/plist -o /tmp
            echo "--- package contents ---"
            pkg info -l -F /tmp/derakht-cli-fish-${PKG_VERSION}.pkg 2>&1 || true
            # Install
            pkg add /tmp/derakht-cli-fish-${PKG_VERSION}.pkg
            echo "--- installed files ---"
            pkg info -l derakht-cli-fish 2>&1 || true
            ls -la /usr/local/bin/derakht-fish* 2>&1 || true
            # Test
            test -f /usr/local/bin/derakht-fish
            echo "--- fish package OK ---"
            # Run fish tests against installed file
            export CLI_SCRIPT_UNDER_TEST=/usr/local/bin/derakht-fish
            test/_bats/bin/bats test/*/*-fish.bats --tap
            # Copy package to workspace
            cp /tmp/derakht-cli-fish-${PKG_VERSION}.pkg .
      - name: Upload .pkg (fish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-freebsd-fish-${{ needs.version.outputs.version }}
          path: derakht-cli-fish-*.pkg
          retention-days: 5

  # ── Build + test Homebrew formula (macOS) ─────────────────────────
  build-homebrew:
    name: "pkg: Homebrew"
    runs-on: macos-latest
    needs: [test, version]
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Cache Homebrew packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-release-${{ runner.os }}
      - name: Install dependencies
        run: |
          brew install bash gawk || true
          brew link --overwrite bash gawk
      - name: Test formula install
        run: |
          # Build local tarball for testing
          ./scripts/make-tarball.sh "/tmp/derakht-cli-${PKG_VERSION}.tar.gz" .
          sha=$(shasum -a 256 "/tmp/derakht-cli-${PKG_VERSION}.tar.gz" | cut -d' ' -f1)
          # Patch formula to point to local tarball for testing
          sed -i '' "s|url .*|url \"file:///tmp/derakht-cli-${PKG_VERSION}.tar.gz\"|" \
            packaging/homebrew/derakht-cli.rb
          sed -i '' "s|sha256 .*|sha256 \"$sha\"|" \
            packaging/homebrew/derakht-cli.rb
          # Create tap and install
          brew tap-new test-user/derakht-cli
          cp packaging/homebrew/derakht-cli.rb \
            "$(brew --repository)/Library/Taps/test-user/homebrew-derakht-cli/Formula/"
          brew install --build-from-source test-user/derakht-cli/derakht-cli
          # Create config file for installed binary (avoids "not a regular file" error)
          cp example.conf ~/.derakht.conf
          # Test version
          derakht --version | grep -q "$PKG_VERSION"
          echo "--- version OK ---"
      - name: Run bats tests against installed binary
        env:
          CLI_SCRIPT_UNDER_TEST: /usr/local/bin/derakht
          MAX_EXEC_MS: 250
          MAX_COMPLETION_MS: 250
          MAX_LARGE_COMPLETION_MS: 350
        run: test/_bats/bin/bats test/*/*-bash.bats test/*/*-all.bats --tap
      - name: Fix formula for release
        run: |
          # Restore formula to point to the GitHub release tarball with real SHA256
          release_url="https://github.com/i-love-coffee-i-love-tea/derakht-cli/archive/refs/tags/v${PKG_VERSION}.tar.gz"
          release_sha=$(curl -sL "$release_url" | shasum -a 256 | cut -d' ' -f1)
          sed -i '' "s|url .*|url \"$release_url\"|" packaging/homebrew/derakht-cli.rb
          sed -i '' "s|sha256 .*|sha256 \"$release_sha\"|" packaging/homebrew/derakht-cli.rb
      - name: Upload formula
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-homebrew-${{ needs.version.outputs.version }}
          path: packaging/homebrew/derakht-cli.rb
          retention-days: 5

  # ── Build + test fish .rpm (Fedora) ───────────────────────────────
  build-rpm-fish:
    name: "pkg: .rpm (fish)"
    runs-on: ubuntu-latest
    needs: [test, version]
    container:
      image: fedora:latest
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: 0
    steps:
      - name: Install git for checkout
        run: dnf install -y git
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install build dependencies
        run: dnf install -y rpm-build rpmdevtools fish gawk
      - name: Build .rpm
        run: |
          rpmdev-setuptree
          mkdir /tmp/src && cp -a . "/tmp/src/derakht-cli-${PKG_VERSION}"
          ./scripts/make-tarball.sh ~/rpmbuild/SOURCES/derakht-cli-${PKG_VERSION}.tar.gz \
            /tmp/src "derakht-cli-${PKG_VERSION}"
          rm -rf /tmp/src
          rpmbuild -ba packaging/rpm/derakht-cli-fish.spec
      - name: Install .rpm
        run: rpm -ivh ~/rpmbuild/RPMS/noarch/derakht-cli-fish-${PKG_VERSION}-1.*.rpm
      - name: Test installed file
        run: |
          test -f /usr/bin/derakht-fish
          echo "--- fish package OK ---"
      - name: Run fish tests against installed file
        run: |
          export CLI_SCRIPT_UNDER_TEST=/usr/bin/derakht-fish
          test/_bats/bin/bats test/*/*-fish.bats --tap
      - name: Upload .rpm (fish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-rpm-fish-${{ needs.version.outputs.version }}
          path: ~/rpmbuild/RPMS/noarch/derakht-cli-fish-*.rpm
          retention-days: 5

  # ── Build + test fish .pkg.tar.zst (Arch Linux) ───────────────────
  build-arch-fish:
    name: "pkg: Arch (fish)"
    runs-on: ubuntu-latest
    needs: [test, version]
    container:
      image: archlinux:latest
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: 0
    steps:
      - name: Install git for checkout
        run: pacman -Sy --noconfirm git
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: pacman -Syu --noconfirm fish gawk base-devel
      - name: Build .pkg.tar.zst
        run: |
          cd packaging/arch
          mkdir /tmp/src && cp -a ../.. "/tmp/src/derakht-cli-${PKG_VERSION}"
          ../../scripts/make-tarball.sh "/tmp/derakht-cli-${PKG_VERSION}.tar.gz" \
            /tmp/src "derakht-cli-${PKG_VERSION}"
          rm -rf /tmp/src
          sha=$(sha256sum "/tmp/derakht-cli-${PKG_VERSION}.tar.gz" | cut -d' ' -f1)
          sed -i "s|source=.*|source=(\"derakht-cli-${PKG_VERSION}.tar.gz::file:///tmp/derakht-cli-${PKG_VERSION}.tar.gz\")|" PKGBUILD-fish
          sed -i "s|sha256sums=.*|sha256sums=('$sha')|" PKGBUILD-fish
          useradd -m builder
          chown -R builder:builder "/tmp/derakht-cli-${PKG_VERSION}.tar.gz" "$GITHUB_WORKSPACE"
          su builder -c "cd $GITHUB_WORKSPACE/packaging/arch && makepkg --noconfirm --nodeps -p PKGBUILD-fish"
      - name: Install .pkg.tar.zst
        run: pacman -U --noconfirm packaging/arch/derakht-cli-fish-*.pkg.tar.zst
      - name: Test installed file
        run: |
          test -f /usr/bin/derakht-fish
          echo "--- fish package OK ---"
      - name: Run fish tests against installed file
        run: |
          export CLI_SCRIPT_UNDER_TEST=/usr/bin/derakht-fish
          test/_bats/bin/bats test/*/*-fish.bats --tap
      - name: Upload .pkg.tar.zst (fish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-arch-fish-${{ needs.version.outputs.version }}
          path: packaging/arch/derakht-cli-fish-*.pkg.tar.zst
          retention-days: 5

  # ── Build + test fish Homebrew formula (macOS) ────────────────────
  build-homebrew-fish:
    name: "pkg: Homebrew (fish)"
    runs-on: macos-latest
    needs: [test, version]
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Install fish
        run: |
          brew install fish gawk || true
          brew link --overwrite fish gawk
      - name: Test formula install
        run: |
          # Build local tarball for testing
          ./scripts/make-tarball.sh "/tmp/derakht-cli-${PKG_VERSION}.tar.gz" .
          sha=$(shasum -a 256 "/tmp/derakht-cli-${PKG_VERSION}.tar.gz" | cut -d' ' -f1)
          # Patch formula to point to local tarball for testing
          sed -i '' "s|url .*|url \"file:///tmp/derakht-cli-${PKG_VERSION}.tar.gz\"|" \
            packaging/homebrew/derakht-cli-fish.rb
          sed -i '' "s|sha256 .*|sha256 \"$sha\"|" \
            packaging/homebrew/derakht-cli-fish.rb
          # Create tap and install
          brew tap-new test-user/derakht-cli
          cp packaging/homebrew/derakht-cli-fish.rb \
            "$(brew --repository)/Library/Taps/test-user/homebrew-derakht-cli/Formula/"
          brew install --build-from-source test-user/derakht-cli/derakht-cli-fish
          test -f "$(brew --prefix)/bin/derakht-fish"
          echo "--- fish package OK ---"
      - name: Fix formula for release
        run: |
          # Restore formula to point to the GitHub release tarball with real SHA256
          release_url="https://github.com/i-love-coffee-i-love-tea/derakht-cli/archive/refs/tags/v${PKG_VERSION}.tar.gz"
          release_sha=$(curl -sL "$release_url" | shasum -a 256 | cut -d' ' -f1)
          sed -i '' "s|url .*|url \"$release_url\"|" packaging/homebrew/derakht-cli-fish.rb
          sed -i '' "s|sha256 .*|sha256 \"$release_sha\"|" packaging/homebrew/derakht-cli-fish.rb
      - name: Upload formula (fish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-homebrew-fish-${{ needs.version.outputs.version }}
          path: packaging/homebrew/derakht-cli-fish.rb
          retention-days: 5

  # ── Build + test Nix expression ───────────────────────────────────
  build-nix:
    name: "pkg: Nix"
    runs-on: ubuntu-latest
    needs: [test, version]
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Install Nix
        run: |
          curl -L https://nixos.org/nix/install -o /tmp/install-nix.sh
          bash /tmp/install-nix.sh --no-daemon
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
      - name: Build and test via nix
        run: |
          export PATH="$HOME/.nix-profile/bin:$PATH"
          # Verify expression parses
          nix-instantiate --parse packaging/nix/default.nix > /dev/null
          # Build with local source override
          nix-build -E "let pkgs = import <nixpkgs> {}; in \
            (pkgs.callPackage packaging/nix/default.nix {}).overrideAttrs (old: { \
              src = pkgs.lib.cleanSource ./.; \
            })"
          result/bin/derakht --version | grep -q "$PKG_VERSION"
          echo "--- version OK ---"
      - name: Upload nix expression
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-nix-${{ needs.version.outputs.version }}
          path: packaging/nix/default.nix
          retention-days: 5

  # ── Build + test Nix expression (fish) ────────────────────────────
  build-nix-fish:
    name: "pkg: Nix (fish)"
    runs-on: ubuntu-latest
    needs: [test, version]
    env:
      PKG_VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - name: Install Nix
        run: |
          curl -L https://nixos.org/nix/install -o /tmp/install-nix.sh
          bash /tmp/install-nix.sh --no-daemon
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
      - name: Build and test via nix
        run: |
          export PATH="$HOME/.nix-profile/bin:$PATH"
          nix-instantiate --parse packaging/nix/default-fish.nix > /dev/null
          nix-build -E "let pkgs = import <nixpkgs> {}; in \
            (pkgs.callPackage packaging/nix/default-fish.nix {}).overrideAttrs (old: { \
              src = pkgs.lib.cleanSource ./.; \
            })"
          test -x result/bin/derakht-fish
          echo "--- fish package OK ---"
      - name: Upload nix expression (fish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-nix-fish-${{ needs.version.outputs.version }}
          path: packaging/nix/default-fish.nix
          retention-days: 5

  # ── Create GitHub Release (only if all builds pass) ───────────────
  release:
    name: "release: GitHub"
    runs-on: ubuntu-latest
    needs: [build-deb, build-rpm, build-arch, build-freebsd, build-homebrew, build-deb-fish, build-rpm-fish, build-arch-fish, build-freebsd-fish, build-homebrew-fish, build-nix, build-nix-fish, version]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/

      - name: Extract release notes
        id: notes
        run: |
          version="${{ needs.version.outputs.version }}"
          notes_file=$(mktemp)
          # Extract the version section, then strip internal sections
          # (### Renamed, ### CI) that are not relevant to end users.
          awk -v ver="$version" '
            /^## / { if (found) exit; if ($2 == ver) found=1; next }
            found && /^### / { skip = ($0 ~ /^### Renamed/ || $0 ~ /^### CI/) }
            found && !skip { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "# Release $version" > "$notes_file"
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: List release assets
        run: find dist/ -type f | sort

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          assets=()
          for f in dist/pkg-deb-${PKG_VERSION}/* dist/pkg-rpm-${PKG_VERSION}/* \
                   dist/pkg-arch-${PKG_VERSION}/* dist/pkg-freebsd-${PKG_VERSION}/* \
                   dist/pkg-homebrew-${PKG_VERSION}/* \
                   dist/pkg-deb-fish-${PKG_VERSION}/* dist/pkg-rpm-fish-${PKG_VERSION}/* \
                   dist/pkg-arch-fish-${PKG_VERSION}/* dist/pkg-freebsd-fish-${PKG_VERSION}/* \
                   dist/pkg-homebrew-fish-${PKG_VERSION}/* \
                   dist/pkg-nix-${PKG_VERSION}/* dist/pkg-nix-fish-${PKG_VERSION}/*; do
            [ -f "$f" ] && assets+=("$f")
          done
          # Standalone scripts
          for f in derakht.sh derakht.fish; do
            [ -f "$f" ] && assets+=("$f")
          done
          for attempt in 1 2 3; do
            if gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "${{ steps.notes.outputs.notes_file }}" \
              "${assets[@]}"; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "error: all 3 attempts to create release failed"
          exit 1

      - name: Publish checksums to Gist
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_VERSION: ${{ needs.version.outputs.version }}
        run: |
          gist_url=$(./scripts/publish-checksums.sh "$PKG_VERSION" dist/)
          echo "Checksums Gist: $gist_url"
          echo "gist_url=$gist_url" >> "$GITHUB_OUTPUT"
