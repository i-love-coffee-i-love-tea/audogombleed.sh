name: Bash Version Compatibility
on:
  push:
    branches: [bash-compat]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash-version:
          - "4.2.53"
          - "4.3.30"
          - "4.4.18"
          - "5.0"
          - "5.1.16"
          - "5.2.37"
          - "5.3"
    name: "bash ${{ matrix.bash-version }}"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Cache apt packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/apt
          key: apt-bash-compat-${{ matrix.bash-version }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev
      - name: "Build & test bash ${{ matrix.bash-version }}"
        run: bash test/bash-compat.sh "${{ matrix.bash-version }}"
